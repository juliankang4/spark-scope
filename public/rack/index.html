<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=1920, height=480, initial-scale=1">
<title data-i18n="rack.pageTitle">Spark Scope rack panel</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="rack.css">
</head>
<body>
<div class="screen" id="screen">
  <div class="bays" id="bays"></div>
  <div class="band">
    <svg id="band-svg" width="1920" height="130" viewBox="0 0 1920 130" aria-hidden="true"><g id="band-plot"></g></svg>
    <div class="over">
      <div class="cl halo"><div><span class="lamp idle" id="cl-lamp"></span><span id="cl-title" data-i18n="rack.cluster.waitingData">Waiting for data</span></div><span id="cl-line1">Waiting for SPARK SCOPE</span><span id="cl-line2"></span></div>
      <div class="out halo"><b id="out-value" class="num">—</b><span>tok/s</span><small data-i18n="rack.output.caption">output (last 5 min)</small></div>
      <div class="tok halo"><b id="tok-total" class="num">—</b><span id="tok-sub" data-i18n="rack.tokensToday">Tokens today</span></div>
    </div>
  </div>
</div>
<script type="module" src="rack.js"></script>
</body>
</html>
