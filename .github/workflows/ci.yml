name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: npm test (Node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Node (node:sqlite without a flag) and the current LTS, on x64 and on arm64 like the
        # Sparks and a Raspberry Pi.
        os: [ubuntu-latest, ubuntu-24.04-arm]
        node: ["22.13", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  check:
    name: repository checks (npm run check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run check

  render:
    name: render check (rack panel and web page)
    # The runner image ships Google Chrome, which tools/render.mjs finds on its own.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node tools/render.mjs
        env:
          OUT: ${{ runner.temp }}/renders
      - name: Keep the renders of a failed check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: ${{ runner.temp }}/renders
          retention-days: 7

  shellcheck:
    name: shellcheck (kiosk script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck kiosk/spark-scope-kiosk

  # The one required check for branch protection: a failure, cancellation or skip in any job fails it.
  ci-passed:
    name: CI passed
    needs: [test, render, shellcheck, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then echo "$failed"; exit 1; fi
